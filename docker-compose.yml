version: '3.8'

services:
  neo4j:
    image: neo4j:5.15.0
    container_name: code-risk-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - code-risk-network

  app:
    build: .
    container_name: code-risk-analyzer
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - neo4j
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    networks:
      - code-risk-network

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  code-risk-network:
    driver: bridge
